- name: read_user_id_all
  value: |
    SELECT  user_id
    FROM    t_user

- name: read_user_search
  value: |
    SELECT  user_id, user_name, user_rank, insert_time, update_time
    FROM    t_user
    WHERE   1 = 1
    #if ${user_id}
            AND user_id = %(user_id)s
    #elif ${user_name}
            AND user_name ILIKE %(user_name)s
    #elif ${user_rank}
            AND user_rank <= %(user_rank)s
    #endif

- name: _filter_by_key
  value:
    user_id: "            AND user_id = %(user_id)s"
    user_name: "            AND user_name ILIKE %(user_name)s"
    user_rank: "            AND user_rank <= %(user_rank)s"

- name: read_user_by_key
  value: |
    SELECT  user_id
    FROM    t_user
    WHERE   1 = 1
    #if ${user_id}
    #include _filter_by_key(user_id)
    #elif ${user_name}
    #include _filter_by_key(user_name)
    #elif ${user_rank}
    #include _filter_by_key(user_rank)
    #endif

- name: read_user_alias
  value: |
    SELECT  user_id "Id|아이디", user_name "Name|이름", user_rank "Rank|순위"
    FROM    t_user
    WHERE   user_id = %(user_id)s

- name: read_csv_partial
  value: |
    SELECT  row_number() OVER (ORDER BY 1) rnum,
            TO_CHAR(generate_series, 'YYYY년 MM월 DD일') each_day
    FROM    generate_series(
                '2001-01-01'::timestamp,
                '2025-12-31'::timestamp,
                '1 day'::interval
            )
